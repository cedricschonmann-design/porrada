<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>PORRADA</title>
  <meta name="description" content="L'appli des pratiquants de JJB et de grappling : construis ton jeu, défie tes partenaires, tiens ton journal, demande les règles aux arbitres.">
  <meta name="theme-color" content="#f3f0f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PORRADA">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/bjj-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/bjj-touch-180.png">
  <link rel="preload" href="fonts/Archivo-var.woff" as="font" type="font/woff" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Thème choisi avant l'affichage, pour éviter un flash blanc.
    try {
      var s = JSON.parse(localStorage.getItem('porrada.v1') || '{}');
      var t = s.settings && s.settings.theme;
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="layer"></div>
  <div id="toast" role="status"></div>
  <noscript>PORRADA a besoin de JavaScript.</noscript>
  <script src="vendor/qrcode.js"></script>
  <script src="vendor/jsQR.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
