# Publie l'appli sur GitHub Pages à chaque envoi sur la branche main.
name: Publier l'appli

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Numéro de version (pour la mise à jour automatique)
        run: |
          BUILD="$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}"
          sed -i "s/__BUILD__/${BUILD}/g" app/sw.js app/js/version.js
          echo "Version ${BUILD}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deploiement
        uses: actions/deploy-pages@v4
